# Without this file golangci-lint runs only its default set — errcheck, gosimple,
# govet, ineffassign, staticcheck, unused — which is why the errors.As misuse, the
# discarded errors, and the unclosed decompressors all passed CI.

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Correctness
    - errorlint    # err.(*T) instead of errors.As — silently broke retry on wrapped errors
    - bodyclose    # unclosed HTTP response bodies
    - contextcheck # functions that should take a context but don't
    - nilerr       # returning nil after checking err != nil
    - rowserrcheck
    - sqlclosecheck
    - durationcheck # time.Duration multiplied by a Duration
    - makezero     # make([]T, n) then append — a classic length/capacity slip

    # Security
    - gosec

    # Clarity
    - revive
    - misspell
    - unconvert
    - wastedassign
    - nakedret
    - goconst
    - copyloopvar

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      # Struct field alignment is a micro-optimisation that hurts readability far
      # more than it helps here; the hot path is network-bound, not cache-bound.
      - fieldalignment

  gosec:
    excludes:
      # Covered explicitly: TLSInsecure is driven by operator config and carries
      # its own nolint at the call site.
      - G402
    config:
      G306: "0644"

  revive:
    rules:
      - name: exported
        arguments: [checkPrivateReceivers, disableStutteringCheck]
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: indent-error-flow
      - name: var-naming
      - name: unreachable-code

  goconst:
    min-len: 4
    min-occurrences: 5
    ignore-tests: true

  misspell:
    locale: UK

issues:
  # The defaults hide most findings behind a per-linter cap, which turns a clean
  # run into false reassurance.
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Tests deliberately ignore errors on setup paths and construct adversarial
    # inputs; gosec in particular has nothing useful to say about them.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - goconst

    # Example functions in the SDK are documentation; they elide error handling on
    # purpose so the shape of the API stays visible.
    - path: example_test\.go
      linters:
        - errcheck
        - revive
