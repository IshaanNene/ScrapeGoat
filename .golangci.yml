# Without this file golangci-lint runs only its default set — errcheck, gosimple,
# govet, ineffassign, staticcheck, unused — which is why the errors.As misuse, the
# discarded errors, and the unclosed decompressors all passed CI.

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Correctness
    - errorlint    # err.(*T) instead of errors.As — silently broke retry on wrapped errors
    - bodyclose    # unclosed HTTP response bodies
    - contextcheck # functions that should take a context but don't
    - nilerr       # returning nil after checking err != nil
    - rowserrcheck
    - sqlclosecheck
    - durationcheck # time.Duration multiplied by a Duration
    - makezero     # make([]T, n) then append — a classic length/capacity slip

    # Security
    - gosec

    # Clarity
    - revive
    - misspell
    - unconvert
    - wastedassign
    - nakedret
    - goconst
    - copyloopvar

# The determinism boundary is enforced by scripts/check-determinism.sh, which runs
# as its own CI step. forbidigo was enabled here too and was the wrong tool for it:
# it has no notion of *where* the boundary is, so it flagged internal/clock — the
# package that implements the clock every other package is told to use — along with
# contrib/, tests/, and cmd/, none of which are in the crawl path. The script knows
# the boundary, carries an allowlist, and supports a per-line `//determinism:allow`
# opt-out at the call site. One precise gate beats two, one of which cries wolf.

linters-settings:
  errcheck:
    check-type-assertions: true

    # check-blank stays off. An explicit `_ = f()` is Go's way of saying "I have
    # considered this error and am discarding it deliberately"; flagging it turns
    # the acknowledgement into the offence and pushes people toward the bare call,
    # which errcheck's real check catches. The unchecked returns that motivated
    # this config were bare calls, not blank assignments.
    check-blank: false

  govet:
    enable-all: true
    disable:
      # Struct field alignment is a micro-optimisation that hurts readability far
      # more than it helps here; the hot path is network-bound, not cache-bound.
      - fieldalignment

      # shadow fires on `if err := f(); err != nil` inside a function that already
      # has an err — the single most common shape in Go, and not a bug in any of
      # the places it fired here. A check that is wrong ~100% of the time trains
      # people to skim past the output, which costs more than it catches.
      - shadow

  gosec:
    excludes:
      # Covered explicitly: TLSInsecure is driven by operator config and carries
      # its own nolint at the call site.
      - G402

      # Weak RNG. Every use here is jitter, proxy rotation, or fingerprint
      # variation — none of it is a secret, and none of it is guessed by an
      # attacker to any advantage. Worse, crypto/rand would defeat the point: the
      # project's reproducibility guarantee depends on a *seedable* source, so a
      # crawl's entropy can be part of its identity. See
      # docs/design/0001-deterministic-crawl.md.
      - G404
    config:
      G306: "0644"

  revive:
    rules:
      - name: exported
        arguments: [checkPrivateReceivers, disableStutteringCheck]
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: indent-error-flow
      - name: var-naming
      - name: unreachable-code

  goconst:
    min-len: 4
    min-occurrences: 5
    ignore-tests: true

  misspell:
    # No locale. misspell's job here is to catch typos — `recieve`, `seperate` —
    # not to adjudicate British against American spelling. With `locale: UK` it
    # flagged the CSS property `color` and the value `center`; with `locale: US` it
    # turned on the prose, which is written in British English throughout. Setting
    # neither leaves it doing the thing that is actually useful.
    ignore-words:
      - cancelled
      - cancelling

issues:
  # The defaults hide most findings behind a per-linter cap, which turns a clean
  # run into false reassurance.
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Determinism boundary. The engine takes time and randomness from injected
    # sources so that a crawl can be replayed (docs/design/0001-deterministic-crawl.md).
    # A single time.Now() or global rand in a new middleware breaks replay
    # silently — nothing fails, the output just stops being reproducible — so the
    # ban is mechanical rather than a matter of remembering.
    #
    # Enforced by scripts/check-determinism.sh in CI as well, because forbidigo
    # is not enabled in every developer's local run.
    # Tests deliberately ignore errors on setup paths and construct adversarial
    # inputs; gosec in particular has nothing useful to say about them.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - goconst

    # Example functions in the SDK are documentation; they elide error handling on
    # purpose so the shape of the API stays visible.
    - path: example_test\.go
      linters:
        - errcheck
        - revive
