# golangci-lint v2. The pin matters: v1.64.8 — the last v1 — is built with Go 1.24
# and refuses to start against a module targeting Go 1.25, so CI's lint step exited
# in 88ms with a config error on every run and never actually linted anything. It
# looked like an ordinary red check, which is how it survived.
#
# Keep the version in .github/workflows/ci.yml in step with this file, and when
# go.mod's Go version moves, check the pinned linter was built with at least that.
version: "2"

run:
  tests: true
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - goconst
    - gosec
    - makezero
    - misspell
    - nakedret
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true

      # check-blank stays off. An explicit `_ = f()` is Go's way of saying "I have
      # considered this error and am discarding it deliberately"; flagging it turns
      # the acknowledgement into the offence and pushes people toward the bare
      # call, which errcheck's real check catches anyway.
      check-blank: false
    goconst:
      min-len: 4
      min-occurrences: 5

      # goconst cannot tell a repeated *identifier* from a repeated *key*, and this
      # codebase writes a lot of both JSON and HTTP: schema keywords, response
      # payload keys, and header names all recur inside composite literals where
      # naming them would make the literal harder to read, not safer. The leading
      # alternative matches header-shaped names (Accept-Language, Sec-Fetch-Dest)
      # as a pattern rather than a list, because the browser-fingerprint tables are
      # literal transcriptions of a protocol and enumerating them here would just
      # be maintaining the same list twice.
      #
      # What is left is what goconst is good for: a domain value repeated across
      # positional struct literals, where a typo compiles and silently means
      # something else. That is how it caught the task status "pending" and the
      # SEO severity "warning"; both are named constants now.
      ignore-strings: '^([A-Z][A-Za-z0-9]*(-[A-Za-z0-9]+)+|Accept|Host|Connection|Referer|Cookie|Origin|type|description|string|object|array|number|boolean|properties|required|items|status|error|message|title|text|name|value|url|job_id|crawl|product|article|email|regex|xpath|unspecified|en-US|http)$'
    gosec:
      excludes:
        # TLSInsecure is driven by operator config and carries its own nolint at
        # the call site.
        - G402

        # Weak RNG. Every use is jitter, proxy rotation, or fingerprint variation —
        # none of it secret, none of it worth guessing. crypto/rand would also
        # defeat the point: reproducibility needs a *seedable* source, so a crawl's
        # entropy can be part of its identity. See
        # docs/design/0001-deterministic-crawl.md.
        - G404
      config:
        G306: "0644"
    govet:
      enable-all: true
      disable:
        # Field alignment is a micro-optimisation that costs more in readability
        # than it returns here; the hot path is network-bound, not cache-bound.
        - fieldalignment

        # shadow fires on `if err := f(); err != nil` inside a function that
        # already has an err — the most common shape in Go, and not a bug in any
        # of the ~44 places it fired. A check that is wrong every time trains
        # people to skim past the output.
        - shadow
    misspell:
      # No locale, on purpose. Under `locale: UK` it flagged the CSS property
      # `color` and the value `center`; under `locale: US` it flagged the prose,
      # which is British throughout. With neither it catches actual typos.
      ignore-rules:
        - cancelled
        - cancelling
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: indent-error-flow
        - name: var-naming
        - name: unreachable-code

  # The determinism boundary is enforced by scripts/check-determinism.sh, its own
  # CI step. forbidigo was enabled here too and was the wrong tool: it has no
  # notion of *where* the boundary is, so it flagged internal/clock — the package
  # that implements the clock everything else is told to use — along with contrib/,
  # tests/, and cmd/. The script knows the boundary, carries an allowlist, and
  # supports a per-line `//determinism:allow` at the call site.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests ignore errors on setup paths and construct adversarial inputs on
      # purpose; gosec in particular has nothing useful to say about them.
      - linters:
          - errcheck
          - goconst
          - gosec
        path: _test\.go
      # Example functions are documentation: they elide error handling so the
      # shape of the API stays visible.
      - linters:
          - errcheck
          - revive
        path: example_test\.go
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # The defaults cap findings per linter, which turns a truncated run into false
  # reassurance.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
