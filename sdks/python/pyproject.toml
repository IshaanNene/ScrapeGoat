[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapegoat"
version = "0.1.0"
description = "Python SDK for the ScrapeGoat web scraping framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Ishaan Nene"}]
keywords = ["scraping", "crawling", "web", "scrapegoat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://github.com/IshaanNene/ScrapeGoat"
Documentation = "https://github.com/IshaanNene/ScrapeGoat/tree/main/sdks/python"
Repository = "https://github.com/IshaanNene/ScrapeGoat"
Issues = "https://github.com/IshaanNene/ScrapeGoat/issues"
