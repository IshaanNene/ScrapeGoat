# Runs the API server and Prometheus.
#
# This file used to describe a master, three worker replicas, a dashboard and
# Redis. None of it worked: the workers' crawl function logged its task and
# returned nil, and `dashboard` was never a subcommand of this binary — contrib
# tools are built separately. It described an architecture, not a deployment.

services:
  api:
    build: .
    container_name: scrapegoat-api
    # The server refuses to start without an API key. Set SCRAPEGOAT_API_KEY in a
    # .env file beside this one rather than putting a key in version control.
    command: ["serve", "--port", "8080"]
    environment:
      - SCRAPEGOAT_API_KEY=${SCRAPEGOAT_API_KEY:?set SCRAPEGOAT_API_KEY, e.g. in a .env file}
    ports:
      - "8080:8080"
    volumes:
      - crawl_data:/data
    networks:
      - scrapegoat

  prometheus:
    image: prom/prometheus:latest
    container_name: scrapegoat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - scrapegoat

networks:
  scrapegoat:
    driver: bridge

volumes:
  crawl_data:
