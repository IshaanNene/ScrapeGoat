name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No branches filter, deliberately.
    #
    # This was `branches: [main]`, which meant a pull request targeting anything
    # else ran no CI at all — and GitHub still reported it mergeable, because the
    # checks that would have gated it never existed to be required. A stacked PR
    # therefore looked exactly like a passing one, with only the secret scan
    # behind it.
    #
    # Retargeting does not rescue it either: changing a PR's base fires
    # `pull_request: edited`, which is not one of the default event types, so the
    # workflow stays unrun until the branch is pushed to or the PR is reopened.
    #
    # Stacking a PR on another is a normal way to split a large change into
    # reviewable pieces. It should not silently cost the tests.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
      # The determinism boundary is invisible when broken — nothing fails, the
      # crawl just stops being reproducible. See docs/design/0001-deterministic-crawl.md.
      - name: Determinism boundary
        run: ./scripts/check-determinism.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

          # Build the linter from source with this repo's Go toolchain instead of
          # downloading a release binary. golangci-lint refuses to load a config
          # whose target Go version is newer than the Go it was built with, and the
          # published binaries lag: both v1.64.8 and v2.1.6 are built with Go 1.24
          # and so exited in ~90ms against our go 1.25 module, having linted
          # nothing, on every run. Building here pins the two together by
          # construction, and cannot silently drift when go.mod moves again.
          install-mode: goinstall
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with coverage
        run: go test ./... -v -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  race:
    name: Race
    runs-on: ubuntu-latest
    # The Redis service container and the step that proved the queue tests really
    # ran are gone with internal/distributed. Keep the shape in mind if a real
    # integration dependency comes back: a test that silently skips in CI is worse
    # than no test, because it reports as coverage.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race tests
        run: go test ./... -race -count=1 -timeout 300s

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # Twenty targets at 60s each, plus a build apiece and room for one retry. The
    # cap exists so a wedged run is killed in half an hour rather than holding a
    # runner for the six-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every parser here consumes bytes chosen by the site being crawled, so
      # "does not panic on hostile input" is a correctness property, not a nicety.
      # The evidence-span target is here for a different reason: it does not crash
      # when it is wrong, it writes a citation pointing at the wrong bytes, which is
      # discoverable only by whoever checks a claim years later.
      # go test runs exactly one -fuzz target at a time, hence the explicit list.
      - name: Fuzz parsers and decoders
        run: |
          set -euo pipefail

          # A fuzz run fails for two very different reasons, and they need
          # different answers.
          #
          # It found an input, which is the point of running it. Go writes that
          # input under the package's testdata/fuzz/<Target>/, where it is
          # untracked — committed seeds are in git. That must never be retried
          # away: a second random run might not rediscover the input, and the job
          # would go green over a real finding.
          #
          # Or the run died for a reason that was not an input. This job runs
          # twenty targets back to back for twenty-odd minutes on a shared runner,
          # and a starved worker missing its deadline surfaces as "context
          # deadline exceeded" with nothing written. That is infrastructure, and
          # it turned a docs-only pull request red once already. It gets one
          # retry, and a second failure is taken at face value.
          run_fuzz() {
            local pkg="$1" target="$2" rc=0
            local found="${pkg#./}/testdata/fuzz/$target"

            echo "::group::$target ($pkg)"
            if go test -run=XXX -fuzz="^$target\$" -fuzztime=60s "$pkg"; then
              echo "::endgroup::"
              return 0
            fi

            if [ -n "$(git status --porcelain -- "$found" 2>/dev/null)" ]; then
              echo "::error::$target found a failing input, saved under $found"
              echo "::endgroup::"
              return 1
            fi

            echo "::warning::$target failed without producing a failing input; retrying once"
            go test -run=XXX -fuzz="^$target\$" -fuzztime=60s "$pkg" || rc=$?
            echo "::endgroup::"
            return $rc
          }
          run_fuzz ./internal/parser  FuzzCompositeParse
          run_fuzz ./internal/parser  FuzzCSSParseWithRules
          run_fuzz ./internal/parser  FuzzCSSSelector
          run_fuzz ./internal/parser  FuzzRegexParse
          run_fuzz ./internal/engine  FuzzCanonicalizeURL
          run_fuzz ./internal/engine  FuzzDeduplicator
          run_fuzz ./internal/engine  FuzzParseRobotsTxt
          run_fuzz ./internal/engine  FuzzMatchRobotsPattern
          run_fuzz ./internal/fetcher FuzzDecompressReader
          run_fuzz ./internal/fetcher FuzzParseRetryAfter
          run_fuzz ./internal/mcp     FuzzHandleMessage
          run_fuzz ./internal/mcp     FuzzToolArguments
          run_fuzz ./internal/mcp     FuzzToolURLValidation
          run_fuzz ./internal/safety  FuzzValidateURL
          run_fuzz ./internal/safety  FuzzBlockReason
          run_fuzz ./internal/provenance FuzzParseRobots
          run_fuzz ./internal/provenance FuzzFromDocument
          run_fuzz ./internal/provenance FuzzFromHeaders
          run_fuzz ./internal/provenance FuzzBuild
          run_fuzz ./internal/provenance FuzzValidateSpanIsAlwaysInBounds

      # A crashing input is written to testdata/fuzz/<Target>/. Publish it so the
      # failure is reproducible from the run rather than only from the log.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          retention-days: 30
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, race]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: go build -o bin/scrapegoat ./cmd/scrapegoat
      - name: Verify binary
        run: ./bin/scrapegoat version

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing built this image, which is how it drifted to a builder older than
      # go.mod's own toolchain and a base image past end of life.
      - name: Build image
        run: docker build -t scrapegoat:ci .
      - name: Verify the binary runs as a non-root user
        run: |
          set -euo pipefail
          docker run --rm scrapegoat:ci version
          user="$(docker run --rm --entrypoint id scrapegoat:ci -un)"
          if [ "$user" = "root" ]; then
            echo "container runs as root; it drives headless Chromium against untrusted pages"
            exit 1
          fi
          echo "runs as $user"
